<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- The Invocations tab's rail glyph: the Lightbearer's playbook mark, traced from
	     assets/icons/playbooks/the_lightbearer_icon.webp by scripts/trace-icon-svg.js. See
	     ATTRIBUTION.md for why a rail icon has to be geometry rather than a raster.

	     TWO deliberate departures from the book's art, and the only reason this file is not a
	     straight tracer output. Both are about the ring; nothing inside it is reshaped.

	     One: the ring is drawn, not traced. The printed mark's ring is an open brush stroke, so
	     the tracer's version of it has two faults the rail cannot carry. Its ends leave a
	     roughly 10 degree void at 9 o'clock, and the band tapers into them, running from 43
	     units wide at 4 o'clock down to 16 at 9. Scaled to the rail's 20px that is a 1.7px
	     stroke thinning to 0.6px before it breaks, so the ring reads as a chipped, lopsided
	     smear rather than as a circle. Both of the loops the tracer emitted for it are replaced
	     by circles concentric on the viewBox centre: 254 outside, 220 inside. Those radii are
	     not eyeballed. 254 is the traced outer edge's mean radius, so the glyph keeps its
	     footprint, and 220 makes the annulus the same area as the traced band (50.6k square
	     units against 50.8k), so the ring keeps its ink weight too. The five loops the tracer
	     found INSIDE the brush stroke go with it, since they were unfilled specks in the ink and
	     two of them straddle the new edges; a speck in exact geometry reads as a rendering fault
	     rather than as ink.

	     Two: the sun is centred in that ring. The trace puts it up and to the left, near enough
	     that the gap closes to 24 units at 10 o'clock while it opens to 49 at 4, and once the
	     ring itself is even that lopsided gap is what the eye reads as the ring being thin on
	     one side. The smallest circle enclosing the rays is centred at 247.5,246.6 with radius
	     183.8, so translating the traced interior by 8.5,9.4 lands that centre on the viewBox
	     centre, which is by definition the placement that opens the tightest gap as far as it
	     will go: 24 units becomes 36. It is a translation and only a translation. No ray is
	     restyled or relengthened, and the flecks travel with the ink they belong to.

	     Everything within the ring is otherwise the trace untouched, roughness and ink flecks
	     alike: the rays, the sun's centre hole, and the two flecks floating in the gap.
	     RE-RUNNING THE TRACER UNDOES BOTH EDITS; redraw the ring and re-centre the sun if you
	     do. -->
