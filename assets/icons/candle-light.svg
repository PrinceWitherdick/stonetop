<svg xmlns="http://www.w3.org/2000/svg" viewBox="155.43 23.56 214.32 464.56">
	<!-- The Lightbearer's holy light, at the end of the appearance line in the character sheet
	     header. Painted as a CSS MASK (.stonetop-holy-light-icon), so only the ALPHA of this
	     file matters: the shape is the hole the colour shows through.

	     TWO departures from the game-icons.net original, both to the CANVAS — the drawing
	     itself is untouched geometry.

	     One: the opaque black backing plate is gone. As a mask, an opaque plate is a perfectly
	     valid one that passes 100% of its own box, so the sheet would render a solid slab that
	     still lays out, hovers and clicks, with nothing logged anywhere. If this icon ever
	     reads as a filled rectangle, that is why.

	     Two: the 0 0 512 512 canvas is CROPPED to the drawing's own bounding box (measured, not
	     eyeballed: x 155.43-369.76, y 23.56-488.12). The original centres a tall narrow candle
	     in a square, which under `mask-size: contain` leaves the glyph floating with ~29% of
	     the box empty on each side and a slice empty below — so the flame could not be sat on
	     the text's baseline, only near it. Cropped, the box IS the candle: the element's
	     0.7em x 1.5em keeps the drawing's 0.4613 aspect, and its bottom edge is the candle's
	     bottom edge. Re-importing the upstream file undoes both; redo them if you do. -->
