<!-- The arrow glyph in bone rather than ink, for dark paper. The original is painted as a
     background image with a fixed near-black fill, so on a dark page it disappears. Same path,
     same viewBox: only the fill differs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="412" height="471" viewBox="0 0 412 471">
  <path d="M 1 1 L 101 234 L 1 469 L 410 235 Z" fill="#d9d2c2"/>
</svg>
