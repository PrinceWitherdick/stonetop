<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 53.09 481.75 420.72">
	<!-- The Judge's scales, standing beside the name plate in the character sheet header the way
	     the Lightbearer's candle does. Painted as a CSS MASK (.stonetop-condemn-icon), so only the
	     ALPHA of this file matters: the shape is the hole the colour shows through.

	     TWO departures from the game-icons.net original, both to the CANVAS — the drawing itself is
	     untouched geometry. They are the same two candle-light.svg makes, for the same reasons; see
	     that file for the long form.

	     One: the opaque black backing plate is gone. As a mask an opaque plate passes 100% of its
	     own box, so the header would render a solid slab that still lays out, hovers and clicks,
	     with nothing logged anywhere. If this icon ever reads as a filled rectangle, that is why.

	     Two: the 0 0 512 512 canvas is CROPPED to the drawing's own bounding box (measured off the
	     path, beziers sampled rather than eyeballed: x 16.00-497.75, y 53.09-473.81). Under
	     `mask-size: contain` the uncropped square left the beam floating a tenth of the box below
	     the top edge, so the glyph could not be centred against the name plate — only placed near
	     it. Cropped, the box IS the scales, and the element's `aspect-ratio` is this viewBox's own
	     481.75 / 420.72. Re-importing the upstream file undoes both; redo them if you do. -->
