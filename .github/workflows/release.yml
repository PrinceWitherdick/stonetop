name: Release

# This workflow is AUTHORITATIVE for what users download. It runs on release:published,
# rebuilds system.json and stonetop.zip from a clean checkout, and OVERWRITES whatever was
# attached to the release by hand. Anything you want in the shipped artifact has to happen
# here, not in a local staging directory.

on:
  release:
    types: [published]

# The one package id this repository publishes. Only a release whose built manifest matches
# it may take the repository's single Latest slot; see the make_latest step below. Each of
# the two repositories sets this to its own id, which is what lets both serve a correct,
# auto-updating manifest URL to their own audience without competing for one slot.
env:
  PUBLISHES_ID: stonetop_pwd

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run pack

      - name: Patch manifest
        id: manifest
        # Every node step here is fed by a QUOTED heredoc, never `node -e "..."`.
        # A `node -e` double-quoted string ends at the first bare double quote inside it, so
        # one quoted phrase in a comment silently truncates the script at that point and the
        # step still exits 0. That shipped: a comment containing "this has moved" cut this
        # step off before both the pin below and writeFileSync, and only the assertion in the
        # verify step caught it. A quoted heredoc has no such escape; ${{ }} still expands
        # because Actions substitutes before the shell ever sees the text.
        run: |
          node <<'PATCH_MANIFEST'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('system.json', 'utf8'));
          m.version = '${{ github.ref_name }}';
          m.download = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/stonetop.zip';
          // Foundry's Setup screen shows a package's title and never its id, so the title is
          // the only thing distinguishing this deprecated package from the renamed one on a
          // machine that has both installed. The repo copy keeps the plain title so the
          // maintainer's own worlds read normally; the SHIPPED one is labelled.
          //
          // The move notice lives in the tree's DESCRIPTION rather than being patched here,
          // unlike the title. Not an inconsistency: the title's reason for being CI-only was
          // that no renamed system existed to send anyone to, and that stopped being true
          // when stonetop-pwd shipped. The description is now simply the truth about this
          // package, so git should say it.
          //
          // ⚠ The manifest URL is deliberately NOT pinned, though it was until 1.3.2.
          // Pinning made every bridge release terminal: an install that took it re-checked
          // its own tag forever and could never be told anything again, so a correction to
          // the move notice could not reach the very people the notice is for. The reason it
          // existed is gone. It guarded against a stonetop-pwd release taking Latest on THIS
          // repo and being served to old-id installs from releases/latest, which cannot
          // happen now that the renamed package lives in its own repository, and which
          // PUBLISHES_ID below independently prevents. Leaving this repo's releases/latest
          // live is what keeps the remaining old-id installs reachable.
          if (m.id === 'stonetop_pwd') {
            m.title = 'Stonetop (DEPRECATED)';
          }
          fs.writeFileSync('system.json', JSON.stringify(m, null, '\t'));
          console.log('patched: ' + m.id + ' ' + m.version + ' "' + m.title + '"');
          console.log('  manifest: ' + m.manifest);
          PATCH_MANIFEST
          # Who gets the repository's single Latest flag, decided from the built manifest
          # rather than from whoever clicked Publish. Installs carry
          # manifest: releases/latest/download/system.json, and Foundry installs by the id in
          # the REMOTE manifest, so a release whose id is not the one this repository
          # publishes, handed the Latest slot, silently swaps the package under every install
          # pointing here. gh and the web UI both mark a new release Latest by DEFAULT, so
          # this cannot be left to remembering a flag: a foreign id is demoted even when it
          # was published as Latest by hand.
          node <<'MAKE_LATEST'
          const m = JSON.parse(require('fs').readFileSync('system.json', 'utf8'));
          const expected = process.env.PUBLISHES_ID;
          const latest = m.id === expected;
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'make_latest=' + latest + '\n');
          console.log('make_latest=' + latest + ' (built id ' + m.id + ', this repo publishes ' + expected + ')');
          MAKE_LATEST

      - name: Ship only the packs system.json declares
        # packs/ accumulates output from packs the manifest no longer declares. Foundry never
        # loads them, but anything tracked in git reaches the checkout and then the zip.
        run: |
          node <<'DROP_UNDECLARED'
          const fs = require('fs');
          const declared = new Set(
            JSON.parse(fs.readFileSync('system.json', 'utf8')).packs.map(p => p.path.split('/').pop())
          );
          for (const name of fs.readdirSync('packs')) {
            if (name === 'src' || declared.has(name)) continue;
            fs.rmSync('packs/' + name, { recursive: true, force: true });
            console.log('dropped undeclared pack: ' + name);
          }
          DROP_UNDECLARED

      - name: Verify the artifact before it ships
        # Private book art is gitignored, so a clean checkout should not contain it. Assert
        # rather than assume: a leak here is public and irreversible.
        run: |
          for d in assets/maps assets/bestiary assets/locations; do
            if [ -e "$d" ]; then echo "FAIL: $d present in the checkout"; exit 1; fi
          done
          # The GM-only "(TEST ONLY) Populate World" macro fetches this file at runtime and
          # skips SILENTLY when it 404s, so an absent one ships a build where the macro just
          # never appears and nothing says why. It used to be gitignored; assert it survived.
          if [ ! -s scripts/local/create-test-characters.js ]; then
            echo "FAIL: scripts/local/create-test-characters.js missing or empty"; exit 1
          fi
          node <<'VERIFY_MANIFEST'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('system.json', 'utf8'));
          if (m.version !== '${{ github.ref_name }}') { console.error('FAIL: version mismatch'); process.exit(1); }
          // The deprecated package must stay REACHABLE, which is the opposite of what this
          // asserted up to 1.3.2. A build whose manifest points at its own tag can never be
          // told anything again, so the remaining old-id installs could not be sent a
          // corrected move notice. See the patch step for why pinning is no longer needed.
          if (m.id === 'stonetop_pwd' && !m.manifest.includes('releases/latest')) {
            console.error('FAIL: deprecated manifest is pinned, which strands its installs: ' + m.manifest);
            process.exit(1);
          }
          // The patch step must have run to completion. Asserting a value it is solely
          // responsible for catches a silently truncated step, which is how an unpatched
          // manifest reached this point once already.
          if (m.id === 'stonetop_pwd' && m.title !== 'Stonetop (DEPRECATED)') {
            console.error('FAIL: deprecated title was not patched: ' + m.title); process.exit(1);
          }
          for (const p of m.packs) {
            if (!fs.existsSync(p.path)) { console.error('FAIL: declared pack missing: ' + p.path); process.exit(1); }
          }
          console.log('manifest ok: ' + m.id + ' ' + m.version + ' "' + m.title + '"');
          VERIFY_MANIFEST

      - name: Create zip
        # scripts/ is a build/dev directory and does NOT ship wholesale — only the one file
        # named explicitly below, which is macro BODY rather than tooling (see the verify
        # step above). Adding scripts/ here would ship the pack/gen/rename node tooling too.
        run: |
          zip -r stonetop.zip \
            system.json stonetop.js LICENSE README.md \
            AI-TRAINING-NOTICE.md ai.txt robots.txt CITATION.cff .well-known/ \
            module/ styles/ languages/ assets/ templates/ packs/ \
            scripts/local/create-test-characters.js \
            --exclude "packs/src/*"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: ${{ steps.manifest.outputs.make_latest }}
          files: |
            stonetop.zip
            system.json
